<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>题库下载 · 河北医科大学题库刷题</title>
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="web.css">
<style>
  body{background:var(--paper);color:var(--ink);font-family:var(--sans);margin:0;padding:28px 18px 60px}
  .dl-wrap{max-width:820px;margin:0 auto}
  .dl-head{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:6px}
  .dl-head h1{font-size:22px;margin:0;letter-spacing:.02em}
  .dl-head a{color:var(--accent);text-decoration:none;font-size:13px}
  .dl-sub{color:var(--ink-3);font-size:13px;line-height:1.8;margin:0 0 20px}
  .dl-tip{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--paper-2);
    font-size:13px;line-height:1.9;color:var(--ink-2);margin:0 0 20px}
  .dl-tip b{color:var(--ink)}
  table{width:100%;border-collapse:collapse;font-size:13.5px}
  th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line)}
  th{color:var(--ink-3);font-weight:500;font-size:12px;letter-spacing:.04em}
  td.num{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-2);white-space:nowrap}
  td a{color:var(--accent);text-decoration:none}
  td a:hover{text-decoration:underline}
  .dl-empty{color:var(--ink-3);font-size:13px;padding:20px 0}
</style>
</head>
<body>
<div class="dl-wrap">
  <div class="dl-head">
    <h1>题库下载</h1>
    <a href="./">← 回到刷题</a>
  </div>
  <p class="dl-sub">这里是网页版正在用的题库文件，按课程拆分。可以直接下载 JSON 自己留存，或者导入到插件 / App 里。</p>

  <div class="dl-tip">
    <b>怎么用：</b><br>
    · 想直接刷题 → <a href="./">回到首页</a>，右上角切换题库即可，不用下载。<br>
    · 想离线保存 → 下载对应 JSON（格式是 <code>hebmu-bank-v1</code> 或网页版课程结构）。<br>
    · 想导入插件 → 在题库缓存里用「导入」把 JSON 粘进去。
  </div>

  <table>
    <thead><tr><th>题库</th><th class="num">题数</th><th class="num">大小</th><th class="num">下载</th></tr></thead>
    <tbody id="dlBody"><tr><td colspan="4" class="dl-empty">加载中…</td></tr></tbody>
  </table>
</div>

<script>
(async function(){
  const body = document.getElementById('dlBody');
  try{
    const res = await fetch('data/index.json', { cache: 'no-store' });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const list = await res.json();
    if(!list.length){ body.innerHTML = '<tr><td colspan="4" class="dl-empty">还没有题库文件</td></tr>'; return; }
    body.innerHTML = '';
    for(const c of list){
      const tr = document.createElement('tr');
      const name = document.createElement('td');
      const n = document.createElement('td'); n.className = 'num';
      const size = document.createElement('td'); size.className = 'num';
      const dl = document.createElement('td'); dl.className = 'num';
      name.textContent = c.name;
      n.textContent = c.count + ' 题';
      size.textContent = Math.max(1, Math.round(c.size / 1024)) + ' KB';
      const a = document.createElement('a');
      a.href = 'data/' + encodeURIComponent(c.id) + '.json';
      a.textContent = '下载';
      a.setAttribute('download', c.name + '.json');
      dl.appendChild(a);
      tr.append(name, n, size, dl);
      body.appendChild(tr);
    }
  }catch(e){
    body.innerHTML = '<tr><td colspan="4" class="dl-empty">加载失败：' + (e.message || e) + '</td></tr>';
  }
})();
</script>
</body>
</html>
